<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>郭炎民 · 个人简历 | AI 应用 / 前端交付 / 知识工程</title>
<meta name="description" content="郭炎民 — 太原科技大学交通工程 2026 级在读，AI 工作流与前端交付方向，持有 14 项头部厂商 AI 专业认证，2 个公网产品已上线。">
<style>

/* ============ Design Tokens ============ */
:root{
  --bg:#f6f7f5;
  --surface:#ffffff;
  --surface-2:#eef1ec;
  --text:#1c2822;
  --text-2:#4a5a52;
  --muted:#75847b;
  --border:#dde3dc;
  --border-2:#e8ece6;
  --primary:#0e7a6f;
  --primary-2:#0a5f56;
  --primary-fg:#ffffff;
  --primary-soft:rgba(14,122,111,.09);
  --accent:#c47a10;
  --accent-soft:rgba(196,122,16,.12);
  --ok:#2f9e6e;
  --shadow-md:0 6px 24px rgba(24,44,37,.08);
  --shadow-lg:0 16px 42px rgba(24,44,37,.15);
  --radius:10px;
  --radius-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --t-fast:150ms;
  --t-base:220ms;
  --ease-out:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#0d1512;
  --surface:#16211b;
  --surface-2:#1c2820;
  --text:#e7eee9;
  --text-2:#a9bab0;
  --muted:#82948a;
  --border:#28352c;
  --border-2:#203026;
  --primary:#41bca9;
  --primary-2:#6cd3c1;
  --primary-fg:#04211c;
  --primary-soft:rgba(65,188,169,.13);
  --accent:#e5a53e;
  --accent-soft:rgba(229,165,62,.14);
  --ok:#4ecb92;
  --shadow-md:0 6px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 42px rgba(0,0,0,.5);
}

/* ============ Base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(14,122,111,.055) 1px,transparent 1px);
  background-size:22px 22px;
}
[data-theme="dark"] body::before{background-image:radial-gradient(rgba(65,188,169,.05) 1px,transparent 1px)}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:64px 0;scroll-margin-top:84px}
.mono{font-family:var(--mono)}

/* ============ Nav ============ */
.nav{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-2);
}
.nav-in{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.02em;flex-shrink:0}
.brand .pi{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:var(--primary-fg);font-family:var(--mono);font-size:16px;font-weight:700;
}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  padding:8px 13px;border-radius:8px;font-size:14px;color:var(--text-2);
  transition:color var(--t-fast) var(--ease-out),background var(--t-fast) var(--ease-out);
  white-space:nowrap;
}
.nav-links a:hover{color:var(--text);background:var(--primary-soft)}
.nav-links a.act{color:var(--primary);background:var(--primary-soft);font-weight:600}
.nav-tools{display:flex;gap:8px;flex-shrink:0}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  transition:all var(--t-fast) var(--ease-out);
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.print-btn{color:var(--primary-fg);background:var(--primary);border-color:var(--primary)}
.icon-btn.print-btn:hover{background:var(--primary-2);color:var(--primary-fg)}

/* ============ Hero ============ */
.hero{padding:72px 0 60px;position:relative;overflow:hidden}
.hero::after{
  content:"炎";position:absolute;right:-30px;top:-90px;
  font-family:var(--mono);font-size:340px;font-weight:700;line-height:1;
  color:var(--primary);opacity:.055;pointer-events:none;user-select:none;
}
.hero-grid{display:grid;grid-template-columns:216px 1fr;gap:52px;align-items:center}
.hero-photo{position:relative;width:216px}
.hero-photo .ph{
  width:216px;height:216px;border-radius:26px;object-fit:cover;display:block;
  border:1px solid var(--border);
  box-shadow:var(--shadow-lg);
}
.hero-photo .ph.ph-fallback{
  display:grid;place-items:center;font-size:64px;font-weight:800;
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));
  color:var(--primary);
}
.hero-photo .pi-badge{
  position:absolute;right:-14px;bottom:-14px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--mono);font-size:24px;font-weight:700;
  border:4px solid var(--bg);box-shadow:var(--shadow-md);
}
.hero-name{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:.02em;line-height:1.15}
.hero-latin{font-family:var(--mono);font-size:13px;letter-spacing:.28em;color:var(--accent);margin-top:8px;text-transform:uppercase}
.intent-chip{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--primary-soft);color:var(--primary);
}
.intent-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,158,110,.4)}50%{box-shadow:0 0 0 6px rgba(47,158,110,0)}}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 0;margin-top:16px;font-size:14px;color:var(--muted)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta i{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block;margin:0 10px}
.hero-meta svg{width:15px;height:15px}
.hero-sum{margin-top:18px;max-width:660px;color:var(--text-2);font-size:15.5px;line-height:1.95}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.badge{
  padding:5px 13px;border-radius:999px;font-size:13px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  transition:all var(--t-fast) var(--ease-out);
}
.badge:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.badge.hot{background:var(--primary-soft);border-color:transparent;color:var(--primary);font-weight:600}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:11px;
  font-size:14.5px;font-weight:600;border:1px solid transparent;
  transition:all var(--t-base) var(--ease-out);min-height:44px;
}
.btn svg{width:17px;height:17px}
.btn-solid{background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow-md)}
.btn-solid:hover{background:var(--primary-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.btn .copied{color:var(--ok);font-weight:700}
.hero-avail{margin-top:16px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hero-avail .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;flex:0 0 auto}

/* ============ Section Head ============ */
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:30px}
.sec-no{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.12em;font-weight:700}
.sec-title{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:.01em}
.sec-line{flex:1;border-top:1px dashed var(--border);transform:translateY(-4px)}
.sec-sub{font-size:13.5px;color:var(--muted);margin:-22px 0 26px}

/* ============ Highlights ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:22px 20px;transition:all var(--t-base) var(--ease-out);position:relative;overflow:hidden;
}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:opacity var(--t-base)}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.stat:hover::before{opacity:1}
.stat .num{font-size:27px;font-weight:800;color:var(--primary);line-height:1.2}
.stat .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--accent);margin-top:6px;text-transform:uppercase;font-weight:700}
.stat .desc{font-size:13px;color:var(--text-2);margin-top:10px;line-height:1.7}

/* ============ Tabs ============ */
.tab-bar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;width:fit-content;max-width:100%;
}
.tab{
  padding:9px 18px;border-radius:9px;font-size:14px;color:var(--text-2);font-weight:500;
  transition:all var(--t-fast) var(--ease-out);white-space:nowrap;min-height:40px;
}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--primary-fg);font-weight:600;box-shadow:var(--shadow-md)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ Timeline (Experience) ============ */
.tl{border-left:2px solid var(--border);margin-left:7px}
.tl-item{position:relative;padding:4px 0 30px 28px}
.tl-item:last-child{padding-bottom:4px}
.tl-item::before{
  content:"";position:absolute;left:-8px;top:10px;width:12px;height:12px;border-radius:50%;
  background:var(--primary);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--primary);
}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.tl-role{font-size:16px;font-weight:700}
.tl-org{font-size:13.5px;color:var(--primary);font-weight:600}
.tl-period{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl-item ul{margin-top:10px}
.tl-item li{
  position:relative;padding-left:18px;font-size:14px;color:var(--text-2);line-height:1.85;margin-top:5px;
}
.tl-item li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:2px;background:var(--accent)}

/* ============ Project Cards ============ */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;transition:all var(--t-base) var(--ease-out);
}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-title{font-size:16.5px;font-weight:700;line-height:1.4}
.pcard-period{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:3px}
.pcard-role{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:4px}
.pcard ul{margin-top:14px;flex:1}
.pcard li{position:relative;padding-left:17px;font-size:13.5px;color:var(--text-2);line-height:1.75;margin-top:7px}
.pcard li::before{content:"";position:absolute;left:2px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--primary)}
.pcard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border)}
.pcard-tags span{
  font-size:11.5px;padding:3px 10px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary);font-weight:600;
}

/* ============ Skills ============ */
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.skill-cat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;transition:all var(--t-base) var(--ease-out);
}
.skill-cat:hover{box-shadow:var(--shadow-md)}
.skill-cat h3{
  display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;margin-bottom:18px;
}
.skill-cat h3 svg{width:17px;height:17px;color:var(--accent)}
.sk{margin-bottom:16px}
.sk:last-child{margin-bottom:0}
.sk-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sk-name{font-size:14px;font-weight:600}
.sk-note{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.sk-pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  transition:width .8s var(--ease-out);
}
.in .bar i{width:var(--w)}

/* ============ Education & Certs ============ */
.edu-grid{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}
.edu-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:28px;position:relative;overflow:hidden;transition:all var(--t-base) var(--ease-out);
}
.edu-card:hover{box-shadow:var(--shadow-md)}
.edu-card::after{content:"炎";position:absolute;right:14px;bottom:-26px;font-family:var(--mono);font-size:120px;font-weight:700;color:var(--primary);opacity:.06}
.edu-school{font-size:19px;font-weight:800}
.edu-major{margin-top:6px;font-size:14.5px;color:var(--primary);font-weight:600}
.edu-period{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;padding:4px 12px;border:1px solid var(--border);border-radius:999px}
.edu-card ul{margin-top:16px;position:relative;z-index:1}
.edu-card li{position:relative;padding-left:18px;font-size:14px;color:var(--text-2);line-height:1.85;margin-top:6px}
.edu-card li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:2px;background:var(--primary)}
.cert-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.cert-card h3{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;margin-bottom:14px}
.cert-card h3 svg{width:17px;height:17px;color:var(--accent)}
.cert-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--border)}
.cert-item:first-of-type{border-top:none}
.cert-item svg{width:15px;height:15px;color:var(--primary);flex:0 0 auto;margin-top:4px}
.cert-item div b{display:block;font-size:13.5px;font-weight:600;line-height:1.5}
.cert-item div small{font-size:12px;color:var(--muted)}

/* ============ Footer & FAB ============ */
footer{border-top:1px solid var(--border-2);padding:34px 0 44px;margin-top:20px}
.foot-in{text-align:center;font-size:13px;color:var(--muted);line-height:2}
.foot-in b{color:var(--text-2)}
.fab{
  position:fixed;right:22px;bottom:22px;z-index:60;width:46px;height:46px;border-radius:50%;
  background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translateY(12px);
  transition:all var(--t-base) var(--ease-out);
}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.fab:hover{background:var(--primary-2)}
.fab svg{width:20px;height:20px}

/* ============ Reveal ============ */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease-out),transform .55s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}

/* ============ Responsive ============ */
@media (max-width:920px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .proj-grid{grid-template-columns:repeat(2,1fr)}
  .hero-grid{grid-template-columns:1fr;gap:30px}
  .hero-photo{width:160px}
  .hero-photo .ph,.hero-photo .ph.ph-fallback{width:160px;height:160px;border-radius:20px}
  .edu-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  section{padding:48px 0}
  .hero{padding:52px 0 44px}
  .proj-grid{grid-template-columns:1fr}
  .skill-grid{grid-template-columns:1fr}
  .tl-period{margin-left:0;width:100%}
  .nav-links{display:none}
  .hero-actions .btn{flex:1 1 auto;justify-content:center}
}

/* ============ Reduced Motion ============ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
  .in .bar i,.bar i{width:var(--w)}
}

/* ============ Print ============ */
@media print{
  @page{size:A4;margin:10mm}
  :root,[data-theme="dark"]{
    --bg:#fff;--surface:#fff;--surface-2:#f1f1ee;--text:#141414;--text-2:#333;--muted:#5a5a5a;
    --border:#ccc;--border-2:#ddd;--primary:#0a6b60;--primary-2:#085448;--primary-fg:#fff;
    --primary-soft:#edf5f2;--accent:#9a6308;--accent-soft:#f8f1e4;
    --shadow-md:none;--shadow-lg:none;
  }
  body::before{display:none}
  .nav,.fab,.hero-actions,.tab-bar,.pi-badge{display:none!important}
  body{font-size:12.5px}
  section{padding:22px 0;scroll-margin-top:0}
  .hero{padding:8px 0 12px}
  .hero::after{display:none}
  .hero-grid{grid-template-columns:120px 1fr;gap:24px}
  .hero-photo .ph,.hero-photo .ph.ph-fallback{width:120px;height:120px;border-radius:14px;box-shadow:none}
  .hero-name{font-size:26px}
  .hero-sum{font-size:12px;line-height:1.7}
  .hero-badges .badge{font-size:10.5px;padding:3px 9px}
  .tabpanel{display:block!important}
  .tabpanel[hidden]{display:block!important}
  .stats{grid-template-columns:repeat(4,1fr)}
  .proj-grid{grid-template-columns:repeat(2,1fr)}
  .skill-grid{grid-template-columns:repeat(2,1fr)}
  .edu-grid{grid-template-columns:1.6fr 1fr}
  .tl{margin-top:4px}
  .tl-item ul li{font-size:10.5px;line-height:1.5;margin:1px 0}
  .tl-item .tl-head{font-size:11.5px}
  section{padding:14px 0}
  .sec-head{margin-bottom:10px}
  .sec-title{font-size:15px}
  .sec-no{font-size:11px}
  .tl-item{padding-bottom:10px}
  .pcard li{font-size:10.5px;line-height:1.55}
  .sk{margin:6px 0}
  .sk-row{font-size:11px}
  .bar{height:5px}
  .edu-card li{font-size:10.5px}
  .cert-item{font-size:10.5px;padding:5px 0}
  footer{padding:8px 0;margin-top:4px}
  .stats{gap:10px}
  .stat{padding:12px 12px}
  .stat .num{font-size:19px}
  .stat .desc{font-size:10.5px;line-height:1.5}
  .stat,.pcard,.skill-cat,.edu-card,.cert-card,.tl-item{break-inside:avoid;box-shadow:none}
  .proj-grid,.skill-grid{gap:10px}
  .pcard{padding:14px}
  .pcard li{font-size:11px;line-height:1.6}
  .tl-item{padding-bottom:14px}
  .tl-item li{font-size:11.5px;line-height:1.6}
  .edu-card,.skill-cat,.cert-card{padding:14px}
  .edu-card::after{display:none}
  .tl-item li::before,.pcard li::before,.edu-card li::before{display:none}

const $html = (s) => { const t = document.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };

/* ================= 主题 ================= */
function initTheme(){
  const saved = localStorage.getItem("gym-theme");
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (sysDark ? "dark" : "light"));
}
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("gym-theme", t); } catch(e){}
  const btn = document.getElementById("themeBtn");
  if(btn){ btn.innerHTML = t === "dark" ? ICONS.sun : ICONS.moon; btn.setAttribute("aria-label", t === "dark" ? "切换到浅色模式" : "切换到深色模式"); }
}

/* ================= 复制（含降级方案） ================= */
async function copyText(text, btn, original){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e2){ ok = false; }
  }
  if(btn){
    const label = btn.querySelector(".bl");
    if(label){
      label.textContent = ok ? "已复制" : text;
      btn.classList.add("copied");
      setTimeout(() => { label.textContent = original; btn.classList.remove("copied"); }, 1600);
    }
  }
}

  /* ---- 技能矩阵 ---- */
  if(resume.skills && resume.skills.length){
    app.appendChild($html(`
    <section id="skills">
      <div class="wrap">
        <div class="sec-head reveal"><span class="sec-no">NO.04</span><h2 class="sec-title">技能矩阵</h2><span class="sec-line"></span></div>
        <div class="skill-grid">
          ${resume.skills.map((c,i)=>`
          <div class="skill-cat reveal d${i%2}">
            <h3>${ICONS[c.icon]||ICONS.doc}${c.cat}</h3>
            ${c.items.map(s=>`
            <div class="sk">
              <div class="sk-row"><span class="sk-name">${s.name}<span class="sk-note">${s.note||""}</span></span><span class="sk-pct">${s.lv}%</span></div>
              <div class="bar"><i style="--w:${s.lv}%"></i></div>
            </div>`).join("")}
          </div>`).join("")}
        </div>
      </div>
    </section>`));
  }

  /* ---- 教育与证书 ---- */
  if(resume.education || (resume.certs && resume.certs.length)){
    const certHtml = (resume.certs||[]).map(c => c.group
      ? `<div class="cert-group">${c.group}</div>`
      : `<div class="cert-item">${ICONS.check}<div><b>${c.name}</b><small>${c.note||""}</small></div></div>`).join("");
    const got = (resume.certs||[]).filter(c=>!c.group && /已获/.test(c.note||"")).length;
    app.appendChild($html(`
    <section id="education">
      <div class="wrap">
        <div class="sec-head reveal"><span class="sec-no">NO.05</span><h2 class="sec-title">教育与证书</h2><span class="sec-line"></span></div>
        <div class="edu-grid">
          ${resume.education?`
          <div class="edu-card reveal">
            <div class="edu-school">${resume.education.school}</div>
            <div class="edu-major">${resume.education.major}</div>
            <span class="edu-period">${resume.education.period}</span>
            <ul>${resume.education.points.map(p=>`<li>${p}</li>`).join("")}</ul>
          </div>`:""}
          ${resume.certs&&resume.certs.length?`
          <div class="cert-card reveal d1">
            <h3>${ICONS.award}专业认证<span style="margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700">${got} 项已获</span></h3>
            ${certHtml}
          </div>`:""}
        </div>
      </div>
    </section>`));
  }

  /* ---- 页脚 ---- */
  app.appendChild($html(`
  <footer>
    <div class="wrap foot-in">
      <div><b>© 2026 ${resume.name} · GYM</b> ｜ 交通工程 × AI 应用 × 前端交付</div>
      <div>一个想找团队、找方向的大一学生 ｜ 如果你在组竞赛队或带课题组，欢迎加 QQ 聊聊 ｜ 更新于 ${resume.updated}</div>
    </div>
  </footer>`));

  /* ---- 返回顶部 ---- */
  app.appendChild($html(`<button class="fab" id="fab" aria-label="返回顶部">${ICONS.up}</button>`));
}

/* ================= Tabs 交互（ARIA + 键盘左右切换） ================= */
function initTabs(){
  document.querySelectorAll('[role="tablist"]').forEach(list=>{
    const tabs = Array.from(list.querySelectorAll('[role="tab"]'));
    const select = (tab)=>{
      tabs.forEach(t=>{
        const on = (t===tab);
        t.setAttribute("aria-selected", on ? "true" : "false");
        t.tabIndex = on ? 0 : -1;
        const panel = document.getElementById(t.getAttribute("aria-controls"));
        if(panel) panel.hidden = !on;
      });
    };
    tabs.forEach(t=>t.addEventListener("click", ()=>select(t)));
    list.addEventListener("keydown", (e)=>{
      const i = tabs.indexOf(document.activeElement);
      if(i < 0) return;
      let n = null;
      if(e.key === "ArrowRight") n = (i+1) % tabs.length;
      else if(e.key === "ArrowLeft") n = (i-1+tabs.length) % tabs.length;
      else if(e.key === "Home") n = 0;
      else if(e.key === "End") n = tabs.length - 1;
      if(n !== null){ e.preventDefault(); tabs[n].focus(); select(tabs[n]); }
    });
  });
}

/* ================= 滚动显现 & 滚动进度 ================= */
function initReveal(){
  const els = document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } });
  }, { threshold: .08, rootMargin: "0px 0px -24px 0px" });
  els.forEach(e=>io.observe(e));
  // 兜底：确保任何情况下都不留空
  setTimeout(()=>{
    els.forEach(e=>{ const r = e.getBoundingClientRect(); if(r.top < window.innerHeight) e.classList.add("in"); });
  }, 1500);
}
function initScrollspy(){
  const links = document.querySelectorAll("#navLinks a");
  if(!links.length || !("IntersectionObserver" in window)) return;
  const map = new Map();
  links.forEach(a=>{ const sec = document.querySelector(a.getAttribute("href")); if(sec) map.set(sec, a); });
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(x=>{
      if(x.isIntersecting){
        links.forEach(a=>a.classList.remove("act"));
        const a = map.get(x.target); if(a) a.classList.add("act");
      }
    });
  }, { rootMargin: "-38% 0px -55% 0px" });
  map.forEach((a,sec)=>io.observe(sec));
}
function initFab(){
  const fab = document.getElementById("fab");
  window.addEventListener("scroll", ()=>{
    fab.classList.toggle("show", window.scrollY > 560);
  }, { passive: true });
  fab.addEventListener("click", ()=>window.scrollTo({ top: 0, behavior: "smooth" }));
}

/* ================= 启动 ================= */
render();
initTheme();
initTabs();
initReveal();
initScrollspy();
initFab();

  const themeBtn = e.target.closest("#themeBtn");
  if(themeBtn){ applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); return; }
  const printBtn = e.target.closest("#printBtn");
  if(printBtn){ window.print(); return; }
  const copyBtn = e.target.closest("[data-copy]");
  if(copyBtn){
    const label = copyBtn.querySelector(".bl");
    const v = copyBtn.getAttribute("data-copy");
    copyText(v === "__email__" ? email() : v, copyBtn, label ? label.textContent : "复制");
  }
});
